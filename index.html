<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>屋內漫步</title>
<style>
  html,body{margin:0;height:100%;background:#0e161d;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#dfe9f3}
  iframe[hidden]{display:none}
</style>
</head>
<body>
<script>
/* House switcher: each house is its own standalone page, loaded in an iframe on first use and kept alive (hidden) so switching is instant. */
const HOUSES=[
  {id:'ctype',name:'Ctype（現在的家）',src:'ctype.html'},
  {id:'town3f',name:'三層透天厝（草案）',src:'town3f.html'},
  {id:'ideal',name:'理想之家（住宅要望書）',src:'ideal.html'},
  {id:'idealWide',name:'理想之家（寬敞版）',src:'ideal_wide.html'}
];
const frames={}, params=new URLSearchParams(location.search);
let cur=null;
const VER='20261011k';                          // bump with the ?v= of the lib files so a house page and its libraries always load together
function frameQuery(){ const q=new URLSearchParams(params); q.delete('house'); q.set('v',VER); return '?'+q.toString()+location.hash; }
function open(id){
  const h=HOUSES.find(function(x){ return x.id===id&&x.src&&!x.disabled; }); if(!h) return false;
  Object.keys(frames).forEach(function(k){ frames[k].hidden=true; });
  if(!frames[id]){ const f=document.createElement('iframe'); f.src=h.src+frameQuery(); f.title=h.name; f.allow='fullscreen'; document.body.appendChild(f); frames[id]=f; }
  frames[id].hidden=false; cur=id;
  Object.keys(frames).forEach(function(k){ try{ frames[k].contentWindow.postMessage({type:'house-active',active:k===id},location.origin); }catch(_){} });   // hidden houses stop drawing
  try{ localStorage.setItem('houseLast',id); }catch(_){}
  document.title='屋內漫步 · '+h.name;
  setTimeout(function(){ try{ frames[id].contentWindow.focus(); }catch(_){} },0);
  return true;
}
function sendList(win){ win.postMessage({type:'house-list',list:HOUSES.map(function(h){ return {id:h.id,name:h.name,disabled:!!h.disabled||!h.src}; }),current:cur},location.origin); }
window.addEventListener('message',function(e){
  const d=e.data; if(e.origin!==location.origin||!d) return;
  const id=Object.keys(frames).find(function(k){ return frames[k].contentWindow===e.source; }); if(!id) return;
  if(d.type==='house-ready') sendList(e.source);
  else if(d.type==='house-switch'&&open(d.id)) Object.keys(frames).forEach(function(k){ sendList(frames[k].contentWindow); });
});
(function(){
  let want=params.get('house'); if(!want){ try{ want=localStorage.getItem('houseLast'); }catch(_){} }
  if(!open(want)) open(HOUSES[0].id);
})();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });   // offline cache
</script>
</body>
</html>
