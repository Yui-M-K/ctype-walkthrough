<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>理想之家 小樣品</title>
<style>
:root{--ink:#17222d;--card:rgba(250,251,252,.9);--line:rgba(23,34,45,.14);--accent:#0a78bb}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe2f1;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.hover{cursor:pointer}
.ui{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:2}
.chip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip b{display:block;font-size:15px}
.chip small{display:block;font-size:12px;color:#5a6978;margin-top:2px}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:rgba(23,34,45,.06);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;white-space:nowrap;z-index:2}
#tip{position:fixed;pointer-events:none;background:#17222d;color:#fff;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;z-index:3;white-space:nowrap}
#tip::after{content:'  E';opacity:.55}
[hidden]{display:none!important}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9f1f7;font-size:15px;z-index:5}
</style></head><body>
<canvas id="c"></canvas>
<div class="ui"><div class="chip"><b>理想之家 小樣品</b><small>客廳＋廚房・白天</small>
  <div class="seg"><button id="sReal" type="button">寫實</button><button id="sAnime" type="button">新海誠風</button></div></div></div>
<div class="hint">WASD 走動・拖曳轉向・指著東西按 E 或點一下</div>
<div id="tip" hidden></div>
<div id="load">載入中…</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {SMAAPass} from 'three/addons/postprocessing/SMAAPass.js';

const ANIME=new URLSearchParams(location.search).get('style')==='anime';
document.getElementById(ANIME?'sAnime':'sReal').setAttribute('aria-pressed','true');
document.getElementById(ANIME?'sReal':'sAnime').setAttribute('aria-pressed','false');

/* ---------- renderer, scene ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=ANIME?THREE.NeutralToneMapping:THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=ANIME?1.0:0.78;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(68,1,0.05,400);

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity=ANIME?0.35:0.55;

/* ---------- painted textures ---------- */
let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
function tex(w,h,draw,rx=1,ry=1,srgb=true){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); t.anisotropy=renderer.capabilities.getMaxAnisotropy(); return t; }
const shade=(hex,k)=>{ const c=new THREE.Color(hex); c.multiplyScalar(k); return '#'+c.getHexString(); };

const woodFloor=tex(1024,1024,(g,w,h)=>{ const n=7, pw=w/n;   // 7 oak planks across a 1.26 m tile, staggered butt joints
  for(let i=0;i<n;i++){ let y=-rnd()*h; while(y<h){ const L=h*(0.45+rnd()*0.5), base=ANIME?shade(0xd2ae80,0.96+rnd()*0.08):shade(0xc4a074,0.86+rnd()*0.2);
      g.fillStyle=base; g.fillRect(i*pw,y,pw,L);
      const lines=ANIME?5:28; for(let k=0;k<lines;k++){ g.strokeStyle=`rgba(${ANIME?'150,105,60':'110,72,40'},${ANIME?0.12:0.05+rnd()*0.1})`; g.lineWidth=ANIME?2:0.6+rnd()*1.4;
        g.beginPath(); let x=i*pw+rnd()*pw; g.moveTo(x,y); for(let s=0;s<=12;s++){ x+=(rnd()-0.5)*(ANIME?2:4); g.lineTo(x,y+L*s/12); } g.stroke(); }
      if(!ANIME&&rnd()<0.5){ g.fillStyle='rgba(90,55,30,0.18)'; g.beginPath(); g.ellipse(i*pw+pw*rnd(),y+L*rnd(),5+rnd()*6,2+rnd()*3,0,0,7); g.fill(); }   // knots
      g.fillStyle='rgba(60,40,25,0.45)'; g.fillRect(i*pw,y,pw,1.5); y+=L; }
    g.fillStyle='rgba(60,40,25,0.45)'; g.fillRect(i*pw,0,1.5,h); } },2.8,2.8);
const fabric=(hex,k)=>tex(256,256,(g,w,h)=>{ g.fillStyle=hex; g.fillRect(0,0,w,h); if(ANIME) return;
  for(let i=0;i<9000;i++){ const v=rnd(); g.fillStyle=`rgba(${v<0.5?0:255},${v<0.5?0:255},${v<0.5?0:255},${0.035})`; g.fillRect(rnd()*w,rnd()*h,2,1); }
  for(let y=0;y<h;y+=3){ g.fillStyle='rgba(0,0,0,0.025)'; g.fillRect(0,y,w,1); } },k,k);
const subway=tex(512,512,(g,w,h)=>{ g.fillStyle='#d9d6cf'; g.fillRect(0,0,w,h); const tw=w/4, th=h/8;   // white subway tiles, 30 x 7.5 cm
  for(let r=0;r<8;r++) for(let c=-1;c<5;c++){ const x=c*tw+(r%2)*tw/2+2, y=r*th+2; g.fillStyle=ANIME?'#f7f6f2':shade(0xf4f2ec,0.97+rnd()*0.04); g.fillRect(x,y,tw-4,th-4); } },3,2.4);
const rugTex=tex(1024,768,(g,w,h)=>{ g.fillStyle=ANIME?'#ece3d2':'#e4dac6'; g.fillRect(0,0,w,h);
  g.strokeStyle=ANIME?'#9fb594':'#8fa58e'; g.lineWidth=18; g.strokeRect(46,46,w-92,h-92); g.strokeStyle=ANIME?'#d8916d':'#c8714f'; g.lineWidth=8; g.strokeRect(84,84,w-168,h-168);
  if(!ANIME) for(let i=0;i<40000;i++){ g.fillStyle=`rgba(0,0,0,${0.025*rnd()})`; g.fillRect(rnd()*w,rnd()*h,2,2); } });
const quartz=tex(512,512,(g,w,h)=>{ g.fillStyle='#f3f1ec'; g.fillRect(0,0,w,h); if(ANIME) return;
  for(let k=0;k<7;k++){ g.strokeStyle=`rgba(150,145,140,${0.08+rnd()*0.1})`; g.lineWidth=1+rnd()*2; g.beginPath(); let x=rnd()*w, y=0; g.moveTo(x,y); while(y<h){ x+=(rnd()-0.5)*40; y+=20; g.lineTo(x,y); } g.stroke(); } },1,1);

/* painted sky: Shinkai-like deep blue and towering cumulus (anime) or a soft hazy day (real), as an equirect background */
const sky=tex(2048,1024,(g,w,h)=>{ const gr=g.createLinearGradient(0,0,0,h*0.5);
  if(ANIME){ gr.addColorStop(0,'#1d5fc9'); gr.addColorStop(0.55,'#4f93e6'); gr.addColorStop(1,'#cfe6fa'); } else { gr.addColorStop(0,'#6f9fd2'); gr.addColorStop(0.6,'#a9c8e6'); gr.addColorStop(1,'#e2ecf3'); }
  g.fillStyle=gr; g.fillRect(0,0,w,h*0.5); g.fillStyle=ANIME?'#cfe2ee':'#d9e2e6'; g.fillRect(0,h*0.5,w,h*0.5);
  const cloud=(cx,cy,s)=>{ const puffs=[]; for(let i=0;i<26;i++){ const a=rnd()*Math.PI, r=s*(0.25+rnd()*0.55); puffs.push([cx+Math.cos(a)*s*1.2*rnd(),cy-Math.sin(a)*s*0.7*rnd(),r]); }
    puffs.sort((p,q)=>p[1]-q[1]);
    if(ANIME){ puffs.forEach(p=>{ g.fillStyle='#a8bfdc'; g.beginPath(); g.arc(p[0],p[1]+p[2]*0.18,p[2],0,7); g.fill(); });   // blue-grey undersides
      puffs.forEach(p=>{ g.fillStyle='#ffffff'; g.beginPath(); g.arc(p[0]-p[2]*0.1,p[1]-p[2]*0.08,p[2]*0.9,0,7); g.fill(); });
      puffs.forEach(p=>{ g.fillStyle='rgba(255,236,205,0.6)'; g.beginPath(); g.arc(p[0]-p[2]*0.25,p[1]-p[2]*0.3,p[2]*0.45,0,7); g.fill(); }); }   // sunlit warm edges
    else { g.filter='blur(6px)'; puffs.forEach(p=>{ g.fillStyle='rgba(255,255,255,0.55)'; g.beginPath(); g.arc(p[0],p[1],p[2],0,7); g.fill(); }); g.filter='none'; } };
  const n=ANIME?14:10; for(let i=0;i<n;i++) cloud(rnd()*w,h*(0.36+rnd()*0.1),ANIME?60+rnd()*90:50+rnd()*70);
  if(ANIME) for(let i=0;i<10;i++){ g.strokeStyle='rgba(255,255,255,0.5)'; g.lineWidth=2+rnd()*3; g.beginPath(); const x=rnd()*w, y=h*(0.12+rnd()*0.18); g.moveTo(x,y); g.lineTo(x+150+rnd()*250,y-10+rnd()*20); g.stroke(); } },1,1);
sky.mapping=THREE.EquirectangularReflectionMapping; sky.wrapS=THREE.RepeatWrapping; scene.background=sky;

/* ---------- materials ---------- */
const grad=(()=>{ const d=new Uint8Array([70,120,165,205,240,255]); const t=new THREE.DataTexture(d,d.length,1,THREE.RedFormat); t.minFilter=t.magFilter=THREE.NearestFilter; t.needsUpdate=true; return t; })();
function mat(color,o={}){
  if(ANIME&&!o.std) return new THREE.MeshToonMaterial({color,map:o.map||null,gradientMap:grad,emissive:o.emissive||0,emissiveIntensity:o.ei??1,transparent:!!o.transparent,opacity:o.opacity??1,side:o.side??THREE.FrontSide,depthWrite:o.depthWrite??true});
  return new THREE.MeshStandardMaterial({color,map:o.map||null,roughness:o.r??0.75,metalness:o.m??0,emissive:o.emissive||0,emissiveIntensity:o.ei??1,transparent:!!o.transparent,opacity:o.opacity??1,side:o.side??THREE.FrontSide,envMapIntensity:o.env??1,depthWrite:o.depthWrite??true});
}
const M={
  wall:mat(ANIME?0xf6f1e8:0xefebe4,{r:0.95}), accent:mat(ANIME?0xb3c7aa:0xa7b39c,{r:0.95}), ceil:mat(ANIME?0xeef3f8:0xf7f6f3,{r:0.95}),
  floor:mat(0xffffff,{map:woodFloor,r:0.42,env:1.1}), oak:mat(ANIME?0xd9b98a:0xc8a578,{map:fabric(ANIME?'#d9b98a':'#c8a578',2),r:0.55}),
  white:mat(0xf3f1ec,{r:0.45}), black:mat(0x1d1f22,{r:0.35,m:0.2}), steel:mat(0xc9cdd1,{r:0.25,m:0.9,std:true}),
  sofa:mat(0xffffff,{map:fabric(ANIME?'#cdc3b2':'#b7ad9d',3),r:0.95}), sage:mat(ANIME?0x9fbf98:0x8fa58e,{r:0.9}), terra:mat(ANIME?0xe39a74:0xc8714f,{r:0.9}),
  rug:mat(0xffffff,{map:rugTex,r:1}), quartz:mat(0xffffff,{map:quartz,r:0.25,env:1.2}), tile:mat(0xffffff,{map:subway,r:0.35}),
  glass:new THREE.MeshPhysicalMaterial({color:0xdfeef5,roughness:0.03,metalness:0,transparent:true,opacity:ANIME?0.08:0.14,envMapIntensity:1.5,depthWrite:false}),
  frame:mat(0x3a3d42,{r:0.4,m:0.6}), leaf:mat(ANIME?0x4f9a4c:0x3f6e3a,{r:0.6,side:THREE.DoubleSide}), pot:mat(0xe8e2d8,{r:0.7}),
  sheer:mat(0xffffff,{transparent:true,opacity:0.55,r:1,side:THREE.DoubleSide,depthWrite:false})
};

/* ---------- build helpers ---------- */
const solids=[]; const things=[]; const noAO=[];   // see-through effects kept out of the AO depth pass
function add(geo,m,x,y,z,o={}){ const me=new THREE.Mesh(geo,m); me.position.set(x,y,z); me.castShadow=o.cast??true; me.receiveShadow=true; (o.parent||scene).add(me); return me; }
function box(x0,x1,y0,y1,z0,z1,m,o={}){ return add(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0),m,(x0+x1)/2,(y0+y1)/2,(z0+z1)/2,o); }
function rbox(x0,x1,y0,y1,z0,z1,r,m,o={}){ const w=x1-x0,h=y1-y0,d=z1-z0; return add(new RoundedBoxGeometry(w,h,d,4,Math.min(r,w/2-1e-3,h/2-1e-3,d/2-1e-3)),m,(x0+x1)/2,(y0+y1)/2,(z0+z1)/2,o); }
function cyl(x,z,r0,r1,y0,y1,m,o={}){ return add(new THREE.CylinderGeometry(r0,r1,y1-y0,o.seg||28),m,x,(y0+y1)/2,z,o); }
const solid=(x0,x1,z0,z1)=>solids.push([x0,x1,z0,z1]);

/* ---------- room: 7 x 5 m, 2.5 m ceiling; living on the west, kitchen on the east; a full-width window to the south ---------- */
const W0=-3.5,W1=3.5,D0=-2.5,D1=2.5,H=2.5,T=0.12;
const floor=add(new THREE.PlaneGeometry(W1-W0,D1-D0),M.floor,0,0,0,{cast:false}); floor.rotation.x=-Math.PI/2;
const ceil=add(new THREE.PlaneGeometry(W1-W0,D1-D0),M.ceil,0,H,0,{cast:false}); ceil.rotation.x=Math.PI/2;
box(W0-T,W0,0,H,D0-T,D1+T,M.accent); box(W1,W1+T,0,H,D0-T,D1+T,M.wall); box(W0,W1,0,H,D0-T,D0,M.wall);
const WX0=-2.9, WX1=1.6, WH=2.2;   // window opening in the south wall
box(W0,WX0,0,H,D1,D1+T,M.wall); box(WX1,W1,0,H,D1,D1+T,M.wall); box(WX0,WX1,WH,H,D1,D1+T,M.wall);
[[D0+0.001,'z'],[W0+0.001,'x'],[W1-0.001,'x']].forEach(([p,a])=>{ const L=a==='z'?W1-W0:D1-D0, b=a==='z'?box(W0,W1,0,0.07,p,p+0.012,M.white,{cast:false}):box(p-(p>0?0.012:0),p+(p>0?0:0.012),0,0.07,D0,D1,M.white,{cast:false}); });   // skirting
// window: dark aluminium frame, two sliding panes, a slim mullion; the sun comes in through the glass
box(WX0,WX1,0,0.03,D1,D1+T,M.frame); box(WX0,WX1,WH-0.04,WH,D1,D1+T,M.frame); box(WX0,WX0+0.04,0,WH,D1,D1+T,M.frame); box(WX1-0.04,WX1,0,WH,D1,D1+T,M.frame); box((WX0+WX1)/2-0.02,(WX0+WX1)/2+0.02,0,WH,D1+0.02,D1+0.08,M.frame);
[[WX0+0.04,(WX0+WX1)/2,D1+0.03],[(WX0+WX1)/2,WX1-0.04,D1+0.07]].forEach(q=>box(q[0],q[1],0.03,WH-0.04,q[2]-0.004,q[2]+0.004,M.glass,{cast:false}));
solid(W0,W1,D1-0.02,D1+1);
// sheer curtains gathered at both ends of the window
[WX0+0.25,WX1-0.25].forEach(cx=>{ const g=new THREE.PlaneGeometry(0.5,WH-0.05,24,1), p=g.attributes.position; for(let i=0;i<p.count;i++) p.setZ(i,Math.sin(p.getX(i)*44)*0.035); g.computeVertexNormals(); const m=add(g,M.sheer,cx,(WH-0.05)/2,D1-0.08,{cast:false}); });
box(WX0-0.1,WX1+0.1,WH+0.02,WH+0.045,D1-0.11,D1-0.05,M.white,{cast:false});
// downlights
[[-2,-1],[-2,1],[0.2,0],[2.2,-1.2],[2.2,0.6]].forEach(q=>{ cyl(q[0],q[1],0.05,0.05,H-0.004,H,mat(0xffffff,{emissive:0xfff3dd,ei:0.4}),{cast:false}); });

/* balcony, a street below and low buildings across it */
box(-3.6,3.6,-0.18,-0.02,D1+T,D1+1.4,mat(0xcfcac2,{r:0.9})); [[D1+1.38]].forEach(q=>{ box(-3.6,3.6,0,1.05,q[0]-0.01,q[0]+0.01,M.glass,{cast:false}); box(-3.6,3.6,1.05,1.09,q[0]-0.02,q[0]+0.02,M.frame); });
const ground=add(new THREE.PlaneGeometry(200,200),mat(ANIME?0x9db6a0:0x8b9a8a,{r:1}),0,-3.2,40,{cast:false}); ground.rotation.x=-Math.PI/2;
const road=add(new THREE.PlaneGeometry(200,8),mat(ANIME?0x7f8a96:0x6a6e72,{r:0.9}),0,-3.18,9,{cast:false}); road.rotation.x=-Math.PI/2;
const winTex=tex(256,512,(g,w,h)=>{ g.fillStyle='#ffffff'; g.fillRect(0,0,w,h); for(let y=20;y<h;y+=64) for(let x=16;x<w;x+=56){ g.fillStyle=ANIME?'#8fb8e6':'#9aaabb'; g.fillRect(x,y,34,40); } },1,1);
for(let i=0;i<26;i++){ const x=-60+i*4.8+rnd()*2, z=34+rnd()*30, w=3+rnd()*4, h=2+rnd()*4.5, c=[0xf2efe9,0xe6e1d8,0xd9dde2,0xefe4d6][i%4];
  const t=winTex.clone(); t.repeat.set(w/4,h/8); t.needsUpdate=true; box(x-w/2,x+w/2,-3.2,-3.2+h,z,z+3,mat(c,{map:t,r:0.85}),{cast:false}); }
for(let i=0;i<14;i++){ const x=-34+i*5+rnd()*2, z=14+rnd()*3; cyl(x,z,0.15,0.2,-3.2,-2.2,mat(0x6b5a44),{cast:false}); const tm=mat(ANIME?0x5fa35a:0x4f7a46,{r:0.9}); for(let k=0;k<5;k++){ const t=new THREE.Mesh(new THREE.SphereGeometry(0.9+rnd()*0.5,18,12),tm); t.position.set(x+(rnd()-0.5)*1.6,-1.9+rnd()*0.9,z+(rnd()-0.5)*1.2); scene.add(t); } }   // street trees as clumps of soft spheres

/* ---------- living room ---------- */
// TV wall: low oak board, 65" TV that can be switched on
rbox(W0,W0+0.42,0,0.42,-0.95,0.95,0.015,M.oak); box(W0+0.42,W0+0.425,0.06,0.4,-0.92,-0.005,M.oak,{cast:false}); solid(W0,W0+0.42,-0.95,0.95);
[[-0.47],[0.47]].forEach(q=>box(W0+0.419,W0+0.423,0.12,0.36,q[0]-0.002,q[0]+0.002,M.black,{cast:false}));
const tvG=new THREE.Group(); tvG.position.set(W0+0.2,0.42,0); scene.add(tvG);
rbox(-0.12,0.12,0,0.015,-0.2,0.2,0.006,M.black,{parent:tvG}); box(-0.02,0.02,0.015,0.28,-0.04,0.04,M.black,{parent:tvG});
rbox(-0.03,0.02,0.18,1.02,-0.73,0.73,0.01,M.black,{parent:tvG});
const tvScreenMat=new THREE.MeshStandardMaterial({color:0x07090c,roughness:0.08,metalness:0.3,envMapIntensity:1.6});
const tvImg=tex(512,288,(g,w,h)=>{ const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#3d8fe0'); gr.addColorStop(0.6,'#b9dcf3'); gr.addColorStop(0.62,'#6aa86b'); gr.addColorStop(1,'#3f7a4a'); g.fillStyle=gr; g.fillRect(0,0,w,h); g.fillStyle='#fff'; [[120,70,40],[300,50,55],[420,90,35]].forEach(c=>{ g.beginPath(); g.arc(c[0],c[1],c[2],0,7); g.fill(); }); });
const screen=add(new THREE.PlaneGeometry(1.42,0.8),tvScreenMat,0.0255,0.6,0,{parent:tvG,cast:false}); screen.rotation.y=Math.PI/2;
let tvOn=false; things.push({obj:tvG,label:()=>tvOn?'關電視':'開電視',act:()=>{ tvOn=!tvOn; tvScreenMat.emissive.set(tvOn?0xffffff:0); tvScreenMat.emissiveMap=tvOn?tvImg:null; tvScreenMat.emissiveIntensity=0.9; tvScreenMat.needsUpdate=true; }});
// sofa facing the TV

canvas.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now()}; canvas.setPointerCapture(e.pointerId); canvas.style.cursor='grabbing'; });

const ray=new THREE.Raycaster(); ray.far=4;

function pick(){ hover=null; if(mouse){ const r=canvas.getBoundingClientRect(); ray.setFromCamera(new THREE.Vector2((mouse.x-r.left)/r.width*2-1,-(mouse.y-r.top)/r.height*2+1),camera);
    const h=ray.intersectObjects(scene.children,true).find(h=>h.object.visible&&h.object.type==='Mesh'); if(h){ let o=h.object; while(o&&!owner.has(o)) o=o.parent; if(o) hover=owner.get(o); } }
  tip.hidden=!hover; canvas.classList.toggle('hover',!!hover); if(hover){ tip.textContent=hover.label(); tip.style.left=(mouse.x+14)+'px'; tip.style.top=(mouse.y+16)+'px'; } }
function doAct(){ if(hover){ hover.act(); pick(); } }
function blocked(x,z){ const r=0.25; if(x<W0+r||x>W1-r||z<D0+r||z>D1-0.1-r) return true; return solids.some(s=>x>s[0]-r&&x<s[1]+r&&z>s[2]-r&&z<s[3]+r); }

document.getElementById('sReal').onclick=()=>{ if(ANIME) sel(false); }; document.getElementById('sAnime').onclick=()=>{ if(!ANIME) sel(true); };

let last=performance.now(), frame=0;
renderer.setAnimationLoop(()=>{ const now=performance.now(), dt=Math.min(0.05,(now-last)/1000); last=now; frame++;
