<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>太陽路徑日照測試</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe3f2;font-family:-apple-system,"Hiragino Sans",sans-serif}
canvas{display:block}
#info{position:fixed;left:12px;top:12px;z-index:30;width:300px;padding:10px 12px;border-radius:12px;background:rgba(30,26,22,.82);color:#f3ece2;font:12px/1.55 -apple-system,"Hiragino Sans",sans-serif}
#info h4{margin:0 0 6px;font-size:13px}#info label{display:flex;gap:6px;align-items:center;margin:3px 0}#info label b{width:60px;font-weight:400;opacity:.8}#info input{flex:1;min-width:0}
#info .r{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.2);font-variant-numeric:tabular-nums}#info button{border:0;border-radius:8px;padding:3px 8px;background:rgba(255,255,255,.16);color:inherit;font:inherit;cursor:pointer;margin:2px 2px 0 0}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<script src="../lib/sun.js?v=1"></script>
</head><body>
<div id="info"><h4>小房子（道路在北、庭院在東）</h4>
<label><b>真北方向</b><input id="north" type="range" min="0" max="359" step="1" value="0"><span id="northV">0°</span></label>
<label><b>屋簷深度</b><input id="eave" type="range" min="0" max="2.5" step="0.05" value="0.9"><span id="eaveV">0.90 m</span></label>
<div><button data-view="persp">斜視</button><button data-view="top">俯視</button><button data-view="south">南面</button><button data-view="inside">室內看電視</button></div>
<div class="r" id="calc"></div></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const Sun=Walk.Sun;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xcfe3f2);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,400);
const orbit=new OrbitControls(camera,renderer.domElement);

/* House geometry, metres. Window is in the south (+Z) wall. Scene north (default -Z) = road side. */
const W=8, Dp=6, H=2.6, T=0.2, SILL=0.9, HEAD=2.1, WX0=-1.5, WX1=1.5;
const mat=function(c,r){ return new THREE.MeshStandardMaterial({color:c,roughness:r==null?0.9:r}); };
const occluders=[];
function box(x0,x1,y0,y1,z0,z1,m,occ){
  const me=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0),m); me.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  me.castShadow=true; me.receiveShadow=true; scene.add(me); if(occ!==false) occluders.push(me); return me;
}
box(-40,40,-0.1,0,-40,40,mat(0x9bb87a),false).castShadow=false;                       // ground
box(-40,40,-0.09,0.01,-14,-8,mat(0x6a6a6e),false).castShadow=false;                   // road (north)
box(W/2+0.2,W/2+9,-0.08,0.02,-6,6,mat(0xd9c9a0),false).castShadow=false;             // courtyard (east)
const wall=mat(0xf1ece2), floorM=mat(0xb48a5a,0.7);
box(-W/2,W/2,0,0.05,-Dp/2,Dp/2,floorM,false);                                          // interior floor
const hx=W/2, hz=Dp/2;
box(-hx,hx,0,H,-hz-T/2,-hz+T/2,wall);                                                  // north wall
box(-hx-T/2,-hx+T/2,0,H,-hz,hz,wall); box(hx-T/2,hx+T/2,0,H,-hz,hz,wall);             // west / east
box(-hx,WX0,0,H,hz-T/2,hz+T/2,wall); box(WX1,hx,0,H,hz-T/2,hz+T/2,wall);              // south wall pieces
box(WX0,WX1,0,SILL,hz-T/2,hz+T/2,wall); box(WX0,WX1,HEAD,H,hz-T/2,hz+T/2,wall);
const roof=box(-hx-0.1,hx+0.1,H,H+0.2,-hz-0.1,hz-T/2,mat(0x5b4a44));                   // roof over the house body (to the wall centre plane)
let eaveMesh=null, eaveDepth=0.9;
function setEave(e){
  eaveDepth=e;
  if(eaveMesh){ scene.remove(eaveMesh); occluders.splice(occluders.indexOf(eaveMesh),1); eaveMesh.geometry.dispose(); eaveMesh=null; }
  if(e>0.001) eaveMesh=box(-hx-0.1,hx+0.1,H,H+0.2,hz-T/2,hz+e,mat(0x5b4a44));        // eave: projects e m south of the wall centre plane
}
const tv=box(-0.6,0.6,0.7,1.4,-hz+T/2,-hz+T/2+0.08,mat(0x111114,0.3));
tv.name='tv'; tv.userData.tv=true;
box(-0.7,0.7,0,0.45,-hz+T/2,-hz+T/2+0.45,mat(0x7b5a3c));                               // TV board

/* compass: arrow lies on the ground, follows ctrl.north */
const compass=new THREE.Group(); scene.add(compass);
compass.position.set(-9,0.05,9);
const disc=new THREE.Mesh(new THREE.CircleGeometry(1.4,40),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.75})); disc.rotation.x=-Math.PI/2; compass.add(disc);
const arrow=new THREE.ArrowHelper(new THREE.Vector3(0,0,-1),new THREE.Vector3(0,0.02,0),1.3,0xd02020,0.45,0.35); compass.add(arrow);
function label(t,col){ const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d'); g.fillStyle=col; g.font='bold 48px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(t,32,34);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false})); s.scale.set(1,1,1); s.renderOrder=5; return s; }
const nLab=label('N','#d02020'), eLab=label('E','#2060c0'); compass.add(nLab,eLab);

const ctrl=Sun.attach({THREE:THREE,scene:scene,north:0,target:new THREE.Vector3(0,0,0),distance:70,peak:3.0,ambient:1.1,
  shadow:{half:18,mapSize:4096,near:5,far:160,bias:-0.0003,normalBias:0.04},date:Sun.jstDate(2026,12,22,12,0)});
let northDeg=0;
const northVec=function(){ const r=northDeg*Math.PI/180; return new THREE.Vector3(Math.sin(r),0,-Math.cos(r)); };
function syncCompass(){
  const n=northVec(), e=new THREE.Vector3().crossVectors(n,new THREE.Vector3(0,1,0));
  arrow.setDirection(n); nLab.position.copy(n).multiplyScalar(1.9).setY(0.3); eLab.position.copy(e).multiplyScalar(1.7).setY(0.3);
}

/* Sun penetration through the south window. d = unit vector toward the sun in house coordinates. */
const DROOM=Dp-T;                           // inner depth between south and north wall planes
function calc(){
  const d=ctrl.state.direction, out={};
  out.alt=ctrl.state.altitude; out.az=ctrl.state.azimuth;
  if(ctrl.state.altitude<=0||d.z<=1e-6||d.y<=1e-6){ out.lit=false; out.reason=ctrl.state.altitude<=0?'太陽在地平線下':'陽光從背面（北側）來，不經南窗'; return out; }
  const k=d.z/d.y;                           // floor distance travelled inward (m) per metre of window height
  const yMax=Math.min(HEAD,H-eaveDepth/k);   // highest window point still sunlit (eave shades above this)
  out.lit=yMax>SILL; out.yMax=yMax;
  out.shadedFrac=1-Math.max(0,Math.min(1,(yMax-SILL)/(HEAD-SILL)));
  out.noEaveDepth=HEAD*k; out.noEaveReach=SILL*k;
  if(!out.lit){ out.depth=0; out.reason='屋簷完全擋住'; return out; }
  out.depth=yMax*k; out.depthNear=SILL*k;
  const c=DROOM*d.y/d.z, s=-DROOM*d.x/d.z;   // where the same rays land on the north wall: height drop c, x shift s
  const hLo=SILL-c, hHi=yMax-c, xLo=WX0+s, xHi=WX1+s;
  out.northWall={lo:Math.max(hLo,0),hi:hHi,floorFirst:hHi<0};
  out.tv=hHi>0.7&&hLo<1.4&&xHi>-0.6&&xLo<0.6;
  return out;
}
/* independent check: raycast from window sample points toward the sun, count unblocked ones */
const ray=new THREE.Raycaster();
function rayCheck(){
  scene.updateMatrixWorld(true);
  const d=ctrl.state.direction; let total=0, open=0, deepest=0;
  if(ctrl.state.altitude<=0||d.z<=1e-6) return {total:0,open:0,deepest:0};
  const k=d.z/d.y;
  for(let i=0;i<=40;i++){ const y=SILL+(HEAD-SILL)*i/40; for(let j=0;j<=6;j++){ const x=WX0+(WX1-WX0)*j/6;
    total++; ray.set(new THREE.Vector3(x,y,hz),d); ray.near=0.001;
    if(ray.intersectObjects(occluders,false).length===0){ open++; deepest=Math.max(deepest,y*k); } } }
  return {total:total,open:open,deepest:deepest};
}
const f1=function(v){ return v.toFixed(2); };
function render(){
  const c=calc(), rc=rayCheck(); window.__calc=c; window.__ray=rc;
  let h='太陽 高度 '+f1(ctrl.state.altitude)+'° / 方位 '+f1(ctrl.state.azimuth)+'°<br>';
  if(c.lit){
    h+='<b>陽光射入深度（南窗，距牆）：'+f1(c.depth)+' m</b>（亮區 '+f1(c.depthNear)+'～'+f1(c.depth)+' m）<br>'
      +'無屋簷時深度 '+f1(c.noEaveDepth)+' m，屋簷擋掉 '+Math.round(c.shadedFrac*100)+'% 的窗高<br>'
      +'北牆落點高度 '+(c.northWall.floorFirst?'先落在地板':f1(c.northWall.lo)+'～'+f1(c.northWall.hi)+' m')+'<br>'
      +'<b>電視（北牆 0.7～1.4 m）：'+(c.tv?'會被陽光照到':'不會照到')+'</b><br>';
  } else h+='<b>陽光射入深度：0 m</b>（'+c.reason+'）<br>';
  h+='<span style="opacity:.7">raycast 驗算：窗面 '+rc.open+'/'+rc.total+' 點未被遮，最深 '+f1(rc.deepest)+' m</span>';
  document.getElementById('calc').innerHTML=h;
}
ctrl.onChange=null;
Sun.initUI(document.body,ctrl);
const prevChange=ctrl.onChange; ctrl.onChange=function(s){ if(prevChange) prevChange(s); render(); };

function setNorth(deg){ northDeg=deg; ctrl.setNorth(northVec()); syncCompass(); document.getElementById('north').value=deg; document.getElementById('northV').textContent=deg+'°'; }
document.getElementById('north').addEventListener('input',function(e){ setNorth(+e.target.value); });
document.getElementById('eave').addEventListener('input',function(e){ setEave(+e.target.value); document.getElementById('eaveV').textContent=(+e.target.value).toFixed(2)+' m'; render(); });
setEave(0.9); setNorth(0);

const VIEWS={persp:[[16,14,20],[0,1,0]],top:[[0,40,0.01],[0,0,0]],south:[[0,1.6,16],[0,1.4,0]],inside:[[0,1.7,2.3],[0,1,-3]]};
function view(n){ const v=VIEWS[n]; camera.position.set(...v[0]); orbit.target.set(...v[1]); orbit.update(); }
document.getElementById('info').addEventListener('click',function(e){ const v=e.target.getAttribute('data-view'); if(v) view(v); });
view('persp');
function setEaveUI(e){ document.getElementById('eave').value=e; document.getElementById('eaveV').textContent=e.toFixed(2)+' m'; setEave(e); render(); }
window.__t={THREE:THREE,ctrl:ctrl,calc:calc,rayCheck:rayCheck,view:view,setNorth:setNorth,setEave:setEaveUI,scene:scene,camera:camera,renderer:renderer,get ready(){return true;}};
addEventListener('resize',function(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
renderer.setAnimationLoop(function(){ orbit.update(); renderer.render(scene,camera); });
</script></body></html>
